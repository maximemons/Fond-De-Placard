<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Fond de placard : l’inventaire de mes placards, frigo et congélateur, partagé avec mon foyer.">
  <title>Fond de placard</title>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Placard">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Chargement -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="brand-mark brand-mark--lg"><span></span><span></span><span></span></div>
  </div>

  <!-- Écran de connexion -->
  <section id="login-screen" class="login hidden" aria-labelledby="login-title">
    <div class="login-inner">
      <div class="brand-mark brand-mark--lg"><span></span><span></span><span></span></div>
      <h1 id="login-title" class="login-title">Fond de placard</h1>
      <p class="login-text">Tout ce qui dort au fond des placards, du frigo et du congélateur, à portée de main. Et ce qui vient à manquer file tout seul sur la liste de courses.</p>

      <div class="seg" role="tablist" aria-label="Connexion">
        <button type="button" role="tab" id="tab-signin" aria-selected="true" data-auth-mode="signin">Se connecter</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false" data-auth-mode="signup">Créer un compte</button>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="field hidden" id="field-name">
          <span class="field-label">Prénom</span>
          <input id="auth-name" type="text" autocomplete="given-name" maxlength="40">
        </label>
        <label class="field">
          <span class="field-label">Adresse e-mail</span>
          <input id="auth-email" type="email" autocomplete="email" inputmode="email" required>
        </label>
        <label class="field">
          <span class="field-label">Mot de passe</span>
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <button id="btn-auth-submit" class="btn btn-primary btn-block" type="submit">Se connecter</button>
        <button id="btn-forgot" class="link-btn" type="button">Mot de passe oublié</button>
      </form>

      <div class="or"><span>ou</span></div>

      <button id="btn-google" class="btn btn-google" type="button">
        <i class="fa-brands fa-google" aria-hidden="true"></i>
        <span>Continuer avec Google</span>
      </button>
      <p id="login-error" class="login-error hidden" role="alert"></p>
    </div>
  </section>

  <!-- Choix du foyer (première connexion avec des invitations) -->
  <section id="onboard-screen" class="login hidden" aria-labelledby="onboard-title">
    <div class="login-inner" id="onboard-inner"></div>
  </section>

  <!-- Application -->
  <div id="app" class="hidden">
    <header class="topbar">
      <button id="btn-back" class="icon-btn hidden" type="button" aria-label="Retour">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <a id="btn-home" class="topbar-brand" href="#/" aria-label="Accueil">
        <div class="brand-mark"><span></span><span></span><span></span></div>
      </a>
      <div class="topbar-title">
        <span id="topbar-kicker" class="topbar-kicker"></span>
        <h1 id="topbar-title">Fond de placard</h1>
      </div>
      <div id="topbar-actions" class="topbar-actions"></div>
      <button id="btn-account" class="avatar-btn" type="button" aria-label="Mon compte et mon foyer"></button>
    </header>

    <div id="offline-bar" class="offline-bar hidden" role="status">
      <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
      Hors ligne : les changements partiront au retour du réseau.
    </div>

    <main id="view" class="view" tabindex="-1"></main>

    <button id="fab" class="add-fab hidden" type="button"></button>

    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#/" data-tab="home"><i class="fa-solid fa-box-archive" aria-hidden="true"></i><span>Placards</span></a>
      <a href="#/courses" data-tab="courses"><i class="fa-solid fa-basket-shopping" aria-hidden="true"></i><span>Courses</span><b id="courses-badge" class="tab-badge hidden"></b></a>
      <button id="btn-scan" class="tab-scan" type="button" aria-label="Scanner un code-barres">
        <i class="fa-solid fa-barcode" aria-hidden="true"></i>
      </button>
      <a href="#/inventaire" data-tab="inventaire"><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i><span>Inventaire</span></a>
      <a href="#/rangements" data-tab="rangements"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>Rangements</span></a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="scanner-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
